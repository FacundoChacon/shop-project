<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Virtual</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <h1>🛒 Mi Tienda Virtual</h1>

    <div class="login-box">

        <input
                type="text"
                id="username"
                placeholder="Usuario">

        <input
                type="password"
                id="password"
                placeholder="Contraseña">

        <button onclick="login()">
            Iniciar sesión
        </button>

    </div>

</header>

<main>

    <section class="acciones">

        <button onclick="cargarProductos()">
            Cargar Productos
        </button>

    </section>

    <section id="productos" class="productos-container">

    </section>

</main>

<script src="js/app.js"></script>

</body>
</html>
